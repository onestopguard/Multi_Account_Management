name: Build on Ubuntu

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 libwebkit2gtk-4.1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri
        run: |
          cd src-tauri
          cargo build --release --target x86_64-pc-windows-gnu

      - name: Upload exe
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: src-tauri/target/x86_64-pc-windows-gnu/release/*.exe