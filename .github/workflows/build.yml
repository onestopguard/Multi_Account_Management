name: Build with Visual Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Visual Studio Build Tools
        uses: jannekem/run-vs-build-tools@v1
        with:
          vs-version: "2022"
          components: "Microsoft.VisualStudio.Workload.VCTools,Microsoft.VisualStudio.Component.VC.Tools.x86.x64,Microsoft.VisualStudio.Component.Windows11SDK.22621"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Cargo build
        working-directory: src-tauri
        run: cargo build --release

      - name: List output files
        run: |
          Get-ChildItem -Path src-tauri/target/release -Filter "*.exe" | Select-Object FullName, Length

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: src-tauri/target/release/*.exe