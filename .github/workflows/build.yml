name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build || echo "Frontend build failed, trying vite directly"

      - name: Create icons directory
        run: mkdir -p src-tauri/icons

      - name: Build Tauri app
        run: npm run tauri build 2>&1 || true

      - name: Check for .app bundle
        run: |
          find src-tauri/target -name "*.app" -type d 2>/dev/null || echo "No .app bundle found"
          ls -la src-tauri/target/release/bundle/macos/ 2>/dev/null || echo "No bundle directory"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: src-tauri/target/release/